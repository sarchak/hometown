<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hometown</title>
<meta name="description" content="A tour-routing agent that finds the cities that already love an act, then builds the night in each one, grounded in Qloo's taste graph.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23D7263D'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23EEF0EA'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <aside class="sheet">
    <header class="brand">
      <h1>Hometown</h1>
      <p class="tag">Every act has hometowns it has never played. This agent finds them, then books the night.</p>
    </header>

    <form id="start" class="start">
      <label for="act">Who is touring?</label>
      <div class="combo">
        <input id="act" name="act" type="text" autocomplete="off" placeholder="A band, comedian, podcast or brand" required>
        <ul id="suggest" class="suggest" hidden></ul>
      </div>
      <div class="row">
        <label>Where
          <select id="region" name="region">
            <option value="us">United States</option>
            <option value="us-east">US East</option>
            <option value="us-south">US South</option>
            <option value="us-midwest">US Midwest</option>
            <option value="us-west">US West</option>
            <option value="canada">Canada</option>
            <option value="uk">UK and Ireland</option>
            <option value="europe">Europe</option>
            <option value="australia">Australia</option>
          </select>
        </label>
        <label>Stops
          <select id="stops" name="stops">
            <option>3</option><option>4</option><option selected>5</option><option>6</option><option>8</option>
          </select>
        </label>
        <label>Rooms
          <select id="kind" name="kind">
            <option value="">Agent picks</option>
            <option value="music">Music venues</option>
            <option value="comedy">Comedy clubs</option>
            <option value="theater">Theaters</option>
            <option value="club">Clubs</option>
          </select>
        </label>
      </div>
      <button type="submit" id="go">Route the tour</button>
      <p class="examples">Try <button type="button" class="ex" data-act="Khruangbin">Khruangbin</button>, <button type="button" class="ex" data-act="Nikki Glaser" data-kind="comedy">Nikki Glaser</button>, <button type="button" class="ex" data-act="Mitski">Mitski</button> or <button type="button" class="ex" data-act="Liquid Death" data-kind="club">a Liquid Death pop-up</button>.</p>
    </form>

    <div id="mock" class="notice" hidden>Synthetic data: the Qloo key is not set on this deployment yet.</div>

    <section id="act-card" class="act" hidden></section>

    <ol id="steps" class="steps"></ol>

    <article id="memo" class="memo" hidden></article>

    <form id="followup" class="followup" hidden>
      <input id="ask" type="text" placeholder="Swap a city, change the rooms, ask who should open" autocomplete="off">
      <button type="submit">Ask</button>
    </form>

    <footer class="foot">
      <span id="calls"></span>
      <a href="https://github.com/sarchak/hometown" rel="noopener">Source</a>
      <button type="button" id="print" hidden>Print the tour book</button>
    </footer>
  </aside>

  <main class="stage">
    <div id="map" class="map" aria-label="Map of ranked markets and the routed tour"></div>
    <section id="book" class="book">
      <div class="book-head">
        <h2 id="book-title">Tour book</h2>
        <p id="book-sub">Rank the markets and the stops will fill in here, in route order.</p>
      </div>
      <div id="markets" class="markets" hidden></div>
      <div id="crowd" class="crowd" hidden></div>
      <div id="stops-list" class="stops"></div>
    </section>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
